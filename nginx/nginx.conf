events {
  worker_connections 1024;
}

http {
  # ── API Microcache (public article reads) ─────────────────────────
  # Published articles are identical for every user; a 30s cache absorbs the
  # read storm after a publish notification without touching node.
  proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:1m
                   max_size=64m inactive=5m use_temp_path=off;

  # ── Gzip Compression ──────────────────────────────────────────────
  gzip              on;
  gzip_vary         on;
  gzip_proxied      any;
  gzip_comp_level   4;
  gzip_min_length   256;
  gzip_types
    application/json
    application/javascript
    text/plain
    text/css
    text/xml
    application/xml;

  # ── Upstream with Keepalive ────────────────────────────────────────
  upstream backend_pool {
    server backend:3000;
    keepalive 32;
  }

  # ── Cloudflare Real IP ────────────────────────────────────────────
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  real_ip_header CF-Connecting-IP;

  # ── Security Headers ──────────────────────────────────────────────
  client_max_body_size 5m;

  # ── SSL Session Cache (reuse TLS handshakes) ──────────────────────
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name api.mediku.app;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name api.mediku.app;

    # Place SSL certs here (e.g. from Let's Encrypt / certbot)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Liveness probe — every client polls this (5s interval while offline) to
    # confirm real reachability. Proxy straight to node: no cache, no auth,
    # no access log (would flood logs at this poll rate).
    location = /health {
      access_log         off;
      proxy_pass         http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
    }

    # REST API
    location /api/ {
      proxy_pass         http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      # Buffering for faster client delivery
      proxy_buffering    on;
      proxy_buffer_size  8k;
      proxy_buffers      8 16k;
    }

    # Admin article routes are authenticated and must never be served from a
    # shared cache. ^~ wins over the regex below for these paths.
    location ^~ /api/v1/articles/admin {
      proxy_pass         http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Public article list + detail (UUID only, so admin paths can't match):
    # response is the same for every user — microcache 30s.
    location ~ "^/api/v1/articles(/[0-9a-fA-F-]{36})?$" {
      proxy_pass         http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      proxy_cache            api_cache;
      proxy_cache_valid      200 30s;
      proxy_cache_use_stale  error timeout updating;
      proxy_cache_lock       on;
      add_header             X-Cache-Status $upstream_cache_status;
    }

    # Static uploads (avatars, images) — served straight off the shared volume,
    # node never sees these requests. Filenames are unique per upload, so the
    # content behind a URL is immutable.
    location /uploads/ {
      alias      /var/www/uploads/;
      try_files  $uri =404;
      expires    1y;
      add_header Cache-Control "public, immutable";
    }

    # WebSocket
    location /ws {
      proxy_pass         http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }
  }
}
