services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    # Loopback publish is kept so the SSH tunnel still works as a fallback:
    #   ssh -L 3001:localhost:3001 admin@103.23.102.190
    # Public access goes through the tailscale sidecar below instead.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/app/data

  # Serves Kuma at https://kuma.<your-tailnet>.ts.net over the tailnet.
  # Userspace networking, so it needs no NET_ADMIN and no /dev/net/tun, and it
  # dials out only - which is why it works despite .190 allowing just 22 and 80 inbound.
  # TS_AUTHKEY comes from /home/admin/uptime-kuma/.env, which is NOT in git.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: uptime-kuma-tailscale
    hostname: kuma
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in /home/admin/uptime-kuma/.env}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./ts-serve.json:/config/serve.json:ro
